name: Release Obsidian plugin

# Dispara ao empurrar uma tag de versão (ex: 0.1.176 — SEM prefixo "v", padrão
# do Obsidian). Builda, valida e publica uma GitHub Release com os 3 arquivos
# (main.js + manifest.json + styles.css) que o Obsidian precisa pra distribuir
# o update automaticamente — sem re-review depois do plugin já estar listado.
#
# Fluxo de update: bump do manifest + commit, depois — NESTA ORDEM:
#
#   git tag 0.9.7
#   git push origin 0.9.7     # 1º a TAG: a Action builda e publica a Release
#   # esperar a Release existir (gh run watch)
#   git push origin main      # 2º a main
#
# A ordem importa. O portal do Obsidian lê o manifest.json no HEAD do branch
# padrão e procura a Release daquela versão. Empurrando a main primeiro, existe
# ~1 minuto em que o manifest já diz a versão nova e a Release ainda está sendo
# buildada — e quem abrir a página nesse intervalo vê "No release matches your
# manifest version". Com a tag primeiro, a main só anuncia a versão depois que
# a Release existe, e a janela deixa de existir. (Aconteceu na 0.9.6.)
#
# Alternativa manual (workflow_dispatch): dispara pela aba Actions / API sem
# push de tag. A versão vem do input `version` ou, se vazio, do manifest.json —
# e a própria Release cria a tag apontando pro commit buildado.

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (vazio = usa manifest.json)"
        required: false
        default: ""

permissions:
  contents: write
  # Atestação de proveniência dos artefatos (recomendação da revisão do
  # Obsidian): assina main.js e styles.css provando que saíram DESTE
  # repositório, neste commit, por este workflow. Quem instala pode verificar
  # com `gh attestation verify main.js --repo axxalab/axxa-agent`.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Peer-deps do obsidian × codemirror conflitam → --legacy-peer-deps.
      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Resolve a tag: push de tag usa o ref; dispatch manual usa o input ou,
      # se vazio, a versão do manifest.json.
      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/}" ]; then
            tag="${{ github.event.inputs.version }}"
            if [ -z "$tag" ]; then
              tag=$(node -p "require('./manifest.json').version")
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag resolvida: $tag"

      # Guarda contra o erro clássico: taggear sem bumpar o manifest.
      - name: Check tag matches manifest version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          ver=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ($tag) != manifest.json ($ver). Bumpe o manifest antes de taggear."
            exit 1
          fi
          echo "OK: $tag == $ver"

      # Assina os artefatos ANTES de publicar: a atestação tem que se referir
      # exatamente aos bytes que vão pra Release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            output/main.js
            output/styles.css

      # Os assets saem em output/ (basename vira main.js/manifest.json/styles.css).
      # Em dispatch manual, `gh release create` cria a tag no commit buildado.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag já existe — nada a fazer."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --target "${GITHUB_SHA}" \
            --notes "AXXA Agent $tag. Veja os commits para o changelog." \
            output/main.js output/manifest.json output/styles.css
